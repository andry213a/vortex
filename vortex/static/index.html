  <!-- Aplicación principal: cabecera, herramientas, listado y zona de arrastre. -->
  <div id="app" class="app hidden">
    <header class="titlebar">
      <div class="titlebar-drag">
        <div class="brand">
          <span class="brand-mark"><img class="brand-icon" src="/static/img/vortex.png" alt="Vortex" /></span>
          <span class="brand-name">VORTEX</span>
          <span class="brand-sep"></span>
          <span class="brand-sub">NAS local</span>
        </div>
        <div id="status-pill" class="status-pill">
          <span class="status-dot"></span>
          <span id="status-text">EN LÍNEA</span>
        </div>
      </div>
      <div class="window-controls">
        <button id="win-minimize" class="window-btn" type="button" title="Minimizar" aria-label="Minimizar"><svg class="icon"><use href="#i-remove"></use></svg></button>
        <button id="win-maximize" class="window-btn" type="button" title="Maximizar" aria-label="Maximizar"><svg class="icon"><use href="#i-crop-square"></use></svg></button>
        <button id="win-close" class="window-btn close" type="button" title="Cerrar" aria-label="Cerrar"><svg class="icon"><use href="#i-close"></use></svg></button>
      </div>
    </header>

    <header class="headerbar">
      <span id="role-badge" class="role-badge"><span class="role-dot"></span><span id="role-label">INVITADO</span></span>
      <div class="header-spacer"></div>
      <div class="search-wrap">
        <svg class="icon search-icon"><use href="#i-search"></use></svg>
        <input id="search" class="search" type="search" placeholder="Buscar o comando…   Ctrl+K" autocomplete="off" spellcheck="false" />
      </div>
      <button id="btn-logs" class="icon-btn hidden" type="button" title="Consola de logs (host)" aria-label="Consola de logs"><svg class="icon"><use href="#i-terminal"></use></svg></button>
      <button id="btn-login" class="icon-btn accent hidden" type="button" title="Iniciar sesión" aria-label="Iniciar sesión"><svg class="icon"><use href="#i-login"></use></svg></button>
      <button id="btn-logout" class="icon-btn danger hidden" type="button" title="Cerrar sesión" aria-label="Cerrar sesión"><svg class="icon"><use href="#i-logout"></use></svg></button>
    </header>

    <div class="toolbar">
      <button id="btn-up" class="icon-btn" type="button" title="Subir un nivel" aria-label="Subir un nivel"><svg class="icon"><use href="#i-arrow-up"></use></svg></button>
      <button id="btn-refresh" class="icon-btn" type="button" title="Actualizar" aria-label="Actualizar"><svg class="icon"><use href="#i-refresh"></use></svg></button>
      <button id="btn-mkdir" class="icon-btn accent" type="button" title="Nueva carpeta" aria-label="Nueva carpeta"><svg class="icon"><use href="#i-new-folder"></use></svg></button>
      <button id="btn-new-text" class="icon-btn accent" type="button" title="Escribir texto y crear .txt" aria-label="Crear archivo de texto"><svg class="icon"><use href="#i-article"></use></svg></button>
      <button id="btn-upload" class="icon-btn accent" type="button" title="Subir archivos" aria-label="Subir archivos"><svg class="icon"><use href="#i-upload"></use></svg></button>
      <button id="btn-zip" class="icon-btn accent" type="button" title="Descargar carpeta (.zip)" aria-label="Descargar carpeta"><svg class="icon"><use href="#i-archive"></use></svg></button>
      <span class="sep"></span>
      <nav id="breadcrumb" class="breadcrumb"></nav>
      <span id="count" class="count"></span>
    </div>

    <main id="listing" class="listing"></main>

    <div id="dropzone" class="dropzone hidden"><div>Suelta los archivos para subirlos a esta carpeta</div></div>
  </div>

  <!-- Pantalla de acceso con contraseña o modo invitado. -->
  <div id="login-overlay" class="login-overlay hidden">
    <form id="login-form" class="login-card">
      <svg class="icon login-icon"><use href="#i-lock"></use></svg>
      <h1>Acceso a Vortex</h1>
      <p class="muted">Introduce la contraseña configurada en el servidor.</p>
      <input id="login-secret" class="input" type="password" placeholder="Contraseña" autocomplete="current-password" />
      <div id="login-error" class="error"></div>
      <div class="login-actions">
        <button type="button" id="login-guest" class="btn ghost hidden">Continuar como invitado</button>
        <span id="login-busy" class="spinner hidden" aria-hidden="true"></span>
        <button type="submit" class="btn primary"><svg class="icon"><use href="#i-login"></use></svg>Entrar</button>
      </div>
    </form>
  </div>

  <!-- Capa compartida para modales, vista previa y paleta de búsqueda. -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div id="modal" class="modal"></div>
  </div>

  <!-- Paleta rápida de búsqueda avanzada. -->
  <div id="palette" class="palette hidden">
    <div class="palette-box">
      <div class="palette-head"><svg class="icon"><use href="#i-bolt"></use></svg><span>HizSearch</span></div>
      <input id="palette-input" class="palette-input" type="text" placeholder="Escribe para buscar · type:video  size:&gt;1gb  ext:pdf" autocomplete="off" spellcheck="false" />
      <div id="palette-results" class="palette-results"></div>
      <div class="palette-hint">[Ctrl+K] abrir · [Esc] cerrar · Enter busca en el servidor</div>
    </div>
  </div>

  <!-- Indicador flotante del progreso de subida. -->
  <div id="mini-vortex" class="mini hidden">
    <div class="mini-head">
      <span class="mini-title"><svg class="icon"><use href="#i-cloud-upload"></use></svg>Mini-Vortex</span>
      <span id="mini-speed" class="mini-speed"></span>
    </div>
    <div id="mini-name" class="mini-name"></div>
    <div class="mini-track"><div id="mini-bar" class="mini-bar"></div></div>
  </div>

  <!-- Consola de auditoría en vivo, visible solo para el host. -->
  <div id="logs-overlay" class="logs-overlay hidden">
    <div class="logs-modal">
      <div class="logs-head">
        <span class="logs-title"><svg class="icon"><use href="#i-terminal"></use></svg>Consola de auditoría en tiempo real</span>
        <button id="logs-close" class="icon-btn" type="button" title="Cerrar" aria-label="Cerrar"><svg class="icon"><use href="#i-close"></use></svg></button>
      </div>
      <div id="logs-body" class="logs-body"></div>
    </div>
  </div>

  <!-- Notificaciones breves y selector oculto de archivos. -->
  <div id="toasts" class="toasts"></div>

  <input id="file-input" type="file" multiple class="hidden" />

  <script src="/static/js/app.js"></script>
</body>
</html>
