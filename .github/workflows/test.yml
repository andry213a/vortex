# Flujo de integración continua para compilar y ejecutar las pruebas.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compilar (verificar sintaxis)
        run: python -m compileall -q vortex tests

      - name: Ejecutar pruebas
        run: python -m pytest -q

      - name: Lint con ruff
        run: ruff check vortex tests
        continue-on-error: true
